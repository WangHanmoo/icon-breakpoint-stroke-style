<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 40 40" width="240" height="240">
  <rect x="-8" y="-8" width="40" height="40" fill="#FFFFFF"/>
  <!-- 2px 模数栅格（0.5px 精度落点） -->
  <g stroke="#F0F0F8" stroke-width="0.2">
    <line x1="2" y1="-8" x2="2" y2="32"/><line x1="6" y1="-8" x2="6" y2="32"/><line x1="10" y1="-8" x2="10" y2="32"/><line x1="14" y1="-8" x2="14" y2="32"/><line x1="18" y1="-8" x2="18" y2="32"/><line x1="22" y1="-8" x2="22" y2="32"/>
    <line x1="-8" y1="2" x2="32" y2="2"/><line x1="-8" y1="6" x2="32" y2="6"/><line x1="-8" y1="10" x2="32" y2="10"/><line x1="-8" y1="14" x2="32" y2="14"/><line x1="-8" y1="18" x2="32" y2="18"/><line x1="-8" y1="22" x2="32" y2="22"/>
  </g>
  <!-- 4px 主栅格 -->
  <g stroke="#E8E8F2" stroke-width="0.25">
    <line x1="0" y1="-8" x2="0" y2="32"/><line x1="4" y1="-8" x2="4" y2="32"/><line x1="8" y1="-8" x2="8" y2="32"/><line x1="12" y1="-8" x2="12" y2="32"/><line x1="16" y1="-8" x2="16" y2="32"/><line x1="20" y1="-8" x2="20" y2="32"/><line x1="24" y1="-8" x2="24" y2="32"/>
    <line x1="-8" y1="0" x2="32" y2="0"/><line x1="-8" y1="4" x2="32" y2="4"/><line x1="-8" y1="8" x2="32" y2="8"/><line x1="-8" y1="12" x2="32" y2="12"/><line x1="-8" y1="16" x2="32" y2="16"/><line x1="-8" y1="20" x2="32" y2="20"/><line x1="-8" y1="24" x2="32" y2="24"/>
  </g>
  <!-- 画布 24 / keyline 22（描边外缘 1–23）/ 安全区 20 -->
  <rect x="0" y="0" width="24" height="24" fill="none" stroke="#C9C9DD" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>
  <rect x="1" y="1" width="22" height="22" fill="none" stroke="#96969B" stroke-width="0.4"/>
  <rect x="2" y="2" width="20" height="20" fill="none" stroke="#D8D8E6" stroke-width="0.4" stroke-dasharray="1 1"/>
  <!-- 参考形：圆 r10 / 容器 20×20 rx5 / 中腔容器 12×12 rx3（可容纳长 4 内部短杠）/ 小容器 9×9（放不下内部元素） -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#E0DFF2" stroke-width="0.4"/>
  <rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="#E0DFF2" stroke-width="0.4"/>
  <rect x="6" y="6" width="12" height="12" rx="3" fill="none" stroke="#EDE3F2" stroke-width="0.4"/>
  <rect x="7.5" y="7.5" width="9" height="9" rx="2.5" fill="none" stroke="#F2E9E9" stroke-width="0.4"/>
  <!-- 绘制区：stroke-width=2, cap/join=round；间隙只允许 2/3/4/6 -->
  <g stroke="#171718" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
